<!doctype html>
<html lang="{{ site.lang | default: 'it' }}" data-theme="dark">
<head>
  {%- include head.html -%}
</head>
<body>
  <canvas id="bg-gears" aria-hidden="true"></canvas>
  {%- include header.html -%}
  <main class="container main">
    {{ content }}
  </main>
  {%- include footer.html -%}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {%- if page.mermaid -%}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    // Convert fenced ```mermaid code blocks (rouge output) into .mermaid divs,
    // reading the literal definition from textContent (preserves <br/> for line breaks).
    document.querySelectorAll('.language-mermaid, pre code.language-mermaid').forEach(function (node) {
      var code = node.querySelector('code') || node;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      (node.closest('div.language-mermaid') || node).replaceWith(div);
    });
    mermaid.initialize({
      startOnLoad: true,
      theme: "base",
      themeVariables: {
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
        fontSize: "14px",
        background: "transparent",
        primaryColor: "#1d2228",
        primaryBorderColor: "#ff8c1a",
        primaryTextColor: "#e7e9ec",
        secondaryColor: "#232931",
        tertiaryColor: "#232931",
        lineColor: "#ff8c1a",
        textColor: "#e7e9ec",
        edgeLabelBackground: "#1d2228"
      }
    });
  </script>
  {%- endif -%}
</body>
</html>
