---
layout: default
---
<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
      {%- for c in page.categories -%}<span class="chip">{{ c }}</span>{%- endfor -%}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif -%}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← Tutti gli articoli</a>
  </footer>
</article>
